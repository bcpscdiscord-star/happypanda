<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Is it...?</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7fb;--card:#fff;--text:#1d2433;--muted:#667;--yes:#2e9e5b;--no:#e0524d;--accent:#3b6df0;--line:#d9e0ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1c2230;--text:#eef1f8;--muted:#9aa5bd;--line:#323b50}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1c2230;--text:#eef1f8;--muted:#9aa5bd;--line:#323b50}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;color:var(--muted);font-weight:600}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px;display:flex;justify-content:center}
.card{background:#fff}.card img{width:100%;max-width:300px;height:auto;display:block}
.q{display:flex;align-items:center;gap:10px;justify-content:center}
.q h1{font-size:28px;margin:0;text-align:center}
.icon{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:22px;cursor:pointer;flex:none}
.ans{display:flex;gap:8px;align-items:stretch}
.ans .main{flex:1;min-height:64px;font-size:22px;font-weight:700;border:none;border-radius:16px;color:#fff;cursor:pointer}
.yes{background:var(--yes)}.no{background:var(--no)}
.ans .icon{height:auto;min-height:64px;border-radius:16px;width:52px}
button:disabled{opacity:.55}
button.good{outline:5px solid var(--yes);opacity:1}
button.bad{outline:5px solid #888;opacity:1}
.fb{min-height:52px;text-align:center;font-size:19px;font-weight:700}
.next{min-height:56px;border:none;border-radius:16px;background:var(--accent);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.center{text-align:center;display:flex;flex-direction:column;gap:18px;margin-top:8vh}
.center h1{font-size:34px;margin:0}.center p{color:var(--muted);font-size:18px;margin:0}
.big{font-size:56px;font-weight:800}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div id="start" class="center">
    <h1>Is it...?</h1>
    <p>Посмотри на картинку, послушай вопрос и выбери ответ.</p>
    <button class="next" id="startBtn">▶ Start</button>
  </div>

  <div id="game" class="hide">
    <div class="top"><span id="num"></span><span id="score"></span></div>
    <div class="card" id="pic" style="margin:14px 0"></div>
    <div class="q"><button class="icon" id="qSpeak" aria-label="Listen">🔊</button><h1 id="qText"></h1></div>
    <div style="height:14px"></div>
    <div class="ans"><button class="main yes" id="yes">Yes, it is</button><button class="icon" data-say="Yes, it is" aria-label="Listen">🔊</button></div>
    <div style="height:10px"></div>
    <div class="ans"><button class="main no" id="no">No, it isn't</button><button class="icon" data-say="No, it isn't" aria-label="Listen">🔊</button></div>
    <div class="fb" id="fb"></div>
    <button class="next hide" id="next" style="width:100%">Next ➜</button>
  </div>

  <div id="end" class="center hide">
    <h1>Well done!</h1>
    <div class="big" id="final"></div>
    <p>Правильных ответов</p>
    <button class="next" id="again">↻ Play again</button>
  </div>
</div>

const svg=(item,color)=>`<img src="${IMGS[item][color]}" alt="${color} ${item}">`;

const $=id=>document.getElementById(id);
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.6;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const art=c=>/^[aeiou]/.test(c)?'an':'a';
let n=0,score=0,correct=true,locked=false,qs='';

function newQ(){
  n++;locked=false;
  const pic={item:rnd(ITEMS),color:rnd(Object.keys(COLORS))};
  const q={...pic};
  correct=Math.random()<.5;
  if(!correct){
    const mode=rnd(['item','color','both']);
    if(mode!=='color')q.item=rnd(ITEMS.filter(i=>i!==pic.item));
    if(mode!=='item')q.color=rnd(Object.keys(COLORS).filter(c=>c!==pic.color));
  }
  qs=`Is it ${art(q.color)} ${q.color} ${q.item}?`;
  $('pic').innerHTML=svg(pic.item,pic.color);
  $('qText').textContent=qs;
  $('num').textContent=`${n} / ${TOTAL}`;
  $('score').textContent=`★ ${score}`;
  $('fb').textContent='';
  $('next').classList.add('hide');
  ['yes','no'].forEach(id=>{const b=$(id);b.disabled=false;b.className='main '+id});
  setTimeout(()=>say(qs),250);
}
function answer(saidYes){
  if(locked)return;locked=true;
  say(saidYes?'Yes, it is':"No, it isn't");
  const ok=saidYes===correct;
  if(ok)score++;
  $('score').textContent=`★ ${score}`;
  $('yes').disabled=$('no').disabled=true;
  $(correct?'yes':'no').classList.add('good');
  if(!ok)$(saidYes?'yes':'no').classList.add('bad');
  $('fb').textContent=ok?'✅ Правильно!':'❌ Не совсем так';
  $('next').textContent=n>=TOTAL?'Finish ➜':'Next ➜';
  $('next').classList.remove('hide');
}
function show(id){['start','game','end'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function begin(){n=0;score=0;show('game');newQ()}

$('startBtn').onclick=begin;
$('again').onclick=begin;
$('qSpeak').onclick=()=>say(qs);
$('yes').onclick=()=>answer(true);
$('no').onclick=()=>answer(false);
document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
$('next').onclick=()=>{if(n>=TOTAL){$('final').textContent=`${score} / ${TOTAL}`;show('end');say('Well done!')}else newQ()};
</script>
